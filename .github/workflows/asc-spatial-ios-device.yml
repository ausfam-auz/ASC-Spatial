name: ASC Spatial iOS device build

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Select the method that matches your Apple provisioning profile
        required: true
        type: choice
        options:
          - development
          - ad-hoc
        default: development

permissions:
  contents: read

jobs:
  ios-device:
    name: Build installable iOS app
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DOMAIN: asc-spatial-backend.replit.app
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLERK_PROXY_URL: ${{ secrets.EXPO_PUBLIC_CLERK_PROXY_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install iOS app dependencies
        run: pnpm install --frozen-lockfile --filter "@workspace/asc-spatial-ios..."

      - name: Generate the native iOS project
        run: pnpm --filter @workspace/asc-spatial-ios exec expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        run: pod install
        working-directory: artifacts/asc-spatial-ios/ios

      - name: Sign and archive the iOS app
        shell: bash
        env:
          ASC_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.ASC_IOS_CERTIFICATE_P12_BASE64 }}
          ASC_IOS_CERTIFICATE_PASSWORD: ${{ secrets.ASC_IOS_CERTIFICATE_PASSWORD }}
          ASC_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.ASC_IOS_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          set -euo pipefail

          : "${ASC_IOS_CERTIFICATE_P12_BASE64:?Add the ASC_IOS_CERTIFICATE_P12_BASE64 repository secret.}"
          : "${ASC_IOS_CERTIFICATE_PASSWORD:?Add the ASC_IOS_CERTIFICATE_PASSWORD repository secret.}"
          : "${ASC_IOS_PROVISIONING_PROFILE_BASE64:?Add the ASC_IOS_PROVISIONING_PROFILE_BASE64 repository secret.}"
          : "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:?Add the EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY repository secret.}"

          case "$EXPORT_METHOD" in
            development)
              signing_identity="Apple Development"
              ;;
            ad-hoc)
              signing_identity="Apple Distribution"
              ;;
            *)
              echo "Unsupported export method: $EXPORT_METHOD" >&2
              exit 1
              ;;
          esac

          keychain_path="$RUNNER_TEMP/asc-spatial-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/asc-spatial-signing.p12"
          profile_path="$RUNNER_TEMP/asc-spatial.mobileprovision"
          decoded_profile="$RUNNER_TEMP/asc-spatial-profile.plist"
          archive_path="$RUNNER_TEMP/ASC-Spatial.xcarchive"
          export_path="$RUNNER_TEMP/asc-spatial-ipa"
          bundle_id="app.replit.ascspatialios"

          cleanup() {
            security delete-keychain "$keychain_path" 2>/dev/null || true
            rm -f "$certificate_path" "$profile_path" "$decoded_profile"
          }
          trap cleanup EXIT

          TEAM_ID="$team_id" PROFILE_NAME="$profile_name" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "asc-spatial-signing.p12").write_bytes(
              base64.b64decode(os.environ["ASC_IOS_CERTIFICATE_P12_BASE64"])
          )
          Path(os.environ["RUNNER_TEMP"], "asc-spatial.mobileprovision").write_bytes(
              base64.b64decode(os.environ["ASC_IOS_PROVISIONING_PROFILE_BASE64"])
          )
          PY

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$ASC_IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security cms -D -i "$profile_path" -o "$decoded_profile"
          profile_uuid=$(/usr/libexec/PlistBuddy -c "Print UUID" "$decoded_profile")
          profile_name=$(/usr/libexec/PlistBuddy -c "Print Name" "$decoded_profile")
          team_id=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$decoded_profile")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          export_options = {
              "method": os.environ["EXPORT_METHOD"],
              "signingStyle": "manual",
              "teamID": os.environ["TEAM_ID"],
              "provisioningProfiles": {
                  "app.replit.ascspatialios": os.environ["PROFILE_NAME"]
              },
              "stripSwiftSymbols": True,
          }
          Path(os.environ["RUNNER_TEMP"], "ExportOptions.plist").write_bytes(
              plistlib.dumps(export_options)
          )
          PY

          ios_dir="artifacts/asc-spatial-ios/ios"
          workspace="$(find "$ios_dir" -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "Expo prebuild did not create an Xcode workspace." >&2
            exit 1
          fi

          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$team_id" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$signing_identity" \
            PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            PRODUCT_BUNDLE_IDENTIFIER="$bundle_id" \
            archive

          mkdir -p "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Save installable IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASC-Spatial-iOS-${{ inputs.export_method }}-${{ github.run_number }}
          path: ${{ runner.temp }}/asc-spatial-ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
